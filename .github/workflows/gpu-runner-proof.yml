name: GPU Runner Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-local-gpu:
    runs-on: [self-hosted, Windows, X64, ptbxl-local]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run bounded NVIDIA workload
        id: gpu
        shell: powershell
        run: |
          $python = 'C:\Python\Python312\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw "Python 3.12 not found at $python" }
          & $python runner_gpu_probe.py --duration 15 --output artifacts/gpu_runner_probe.json
          if ($LASTEXITCODE -ne 0) { throw "GPU proof failed" }

      - name: Validate machine-readable proof
        shell: powershell
        run: |
          $proof = Get-Content artifacts/gpu_runner_probe.json -Raw | ConvertFrom-Json
          if ($proof.status -ne 'passed') { throw "GPU proof JSON did not report success" }
          Write-Host 'Machine-readable GPU proof:'
          Get-Content artifacts/gpu_runner_probe.json
