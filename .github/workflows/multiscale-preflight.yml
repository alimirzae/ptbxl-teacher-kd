name: Multiscale Teacher Preflight

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: [self-hosted, Windows, X64, ptbxl-local]
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run environment preflight
        shell: powershell
        run: |
          $python = 'C:\Python\Python312\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw 'Python312 missing' }
          & $python -m py_compile "$env:GITHUB_WORKSPACE\14_check_multiscale_stage_ready.py"
          if ($LASTEXITCODE -ne 0) { throw 'Preflight script syntax failed' }
          & $python "$env:GITHUB_WORKSPACE\14_check_multiscale_stage_ready.py"
          if ($LASTEXITCODE -ne 0) { throw 'Preflight failed' }

      - name: Print result
        shell: powershell
        run: |
          $file = 'C:\ptbxl\results\teacher_multiscale_staged\preflight.json'
          if (Test-Path -LiteralPath $file) {
            Get-Content -LiteralPath $file
          } else {
            Write-Warning 'No preflight JSON found.'
          }
